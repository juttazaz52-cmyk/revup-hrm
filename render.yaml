services:
  - type: web
    name: revup-hrm
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: hrm-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DB_PATH
        value: /var/data/hrm.sqlite
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AYESHA_TEMP_PASSWORD
        sync: false
      - key: HAFI_TEMP_PASSWORD
        sync: false
